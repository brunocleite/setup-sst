version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
    # The next major of each @actions/* package is ESM-only, which ncc cannot
    # bundle for a node24 action. Majors must be adopted deliberately, not by
    # an automated PR. See "_dependencyNotes" in package.json.
    ignore:
      - dependency-name: '@actions/*'
        update-types: ['version-update:semver-major']

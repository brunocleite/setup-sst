name: Consumer smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create a brand-new SST app
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          cat > package.json <<'JSON'
          { "name": "consumer", "version": "1.0.0", "dependencies": { "sst": "3.19.3" } }
          JSON
          cat > sst.config.ts <<'TS'
          /// <reference path="./.sst/platform/config.d.ts" />
          export default $config({
            app() { return { name: 'consumer', removal: 'remove', home: 'aws' } },
            async run() {}
          })
          TS
          npm install
      - name: Use the PUBLISHED action exactly as the README documents
        id: sst
        uses: brunocleite/setup-sst@v1
        with:
          sst-path: /tmp/app
      - name: Assert it worked
        run: |
          echo "cache-hit=${{ steps.sst.outputs.cache-hit }}"
          echo "sst-version=${{ steps.sst.outputs.sst-version }}"
          test "${{ steps.sst.outputs.sst-version }}" = "3.19.3"
          test -f /tmp/app/.sst/platform/version
          echo "Platform: $(cat /tmp/app/.sst/platform/version)"

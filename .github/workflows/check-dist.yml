# `dist/` holds the bundled JavaScript that GitHub actually runs, so it is
# committed to the repository. This workflow rebuilds it from `src/` and fails
# when the result differs from what was committed.
name: Check dist/

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Rebuild dist/
        run: npm run package

      - name: Compare against the committed dist/
        id: diff
        run: |
          if [ ! -d dist/ ]; then
            echo "::error::dist/ does not exist. Run 'npm run all' and commit it."
            exit 1
          fi
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt 0 ]; then
            echo "::error::dist/ is out of date. Run 'npm run all' and commit the result."
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi
          echo "dist/ matches src/."

      - if: ${{ failure() && steps.diff.outcome == 'failure' }}
        name: Upload the expected dist/
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
